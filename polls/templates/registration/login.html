<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-semibold text-slate-900 mb-2">Sign in</h1>
        <p class="text-sm text-slate-600 mb-6">Use your account to access your notes and flashcards.</p>
        {% if form.errors %}
        <div class="mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
            Invalid username or password.
        </div>
        {% endif %}
        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm text-slate-700">Username</label>
                <input type="text" name="username" required autofocus class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-400/60">
            </div>
            <div>
                <label class="text-sm text-slate-700">Password</label>
                <input type="password" name="password" required class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-400/60">
            </div>
            <div class="flex items-center justify-between text-sm text-slate-500">
                <a href="/admin/password_reset/" class="text-teal-600 hover:text-teal-700">Forgot password?</a>
            </div>
            <button type="submit" class="w-full bg-teal-500 text-white font-semibold py-2.5 rounded-xl hover:-translate-y-0.5 transition shadow-lg shadow-teal-500/20">Login</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>
</html>
